services:
  astro:
    build: .
    container_name: astro_starlight
    working_dir: /app
    volumes:
      - ./app:/app
      - ./docker:/docker
      - astro_node_modules:/app/node_modules
    ports:
      - "4321:4321"
    environment:
      CI: true
      CHOKIDAR_USEPOLLING: true
      MODE: ${MODE}
    command: sh /docker/start.sh

  nginx:
    image: nginx:alpine
    container_name: astro_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - astro

volumes:
  astro_node_modules:

